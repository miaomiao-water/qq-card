<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f7fb">
  <title>打开 QQ 个人资料</title>
  <meta name="description" content="点击按钮尝试在手机 QQ 中打开个人资料页，也可一键复制 QQ 号。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="打开 QQ 个人资料">
  <meta property="og:description" content="点击按钮尝试在手机 QQ 中打开个人资料页。">

  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #f5f7fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(18, 183, 245, .14), transparent 38%),
        #f5f7fb;
    }

    .card {
      width: min(100%, 390px);
      padding: 34px 24px 24px;
      text-align: center;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(15, 23, 42, .06);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, .09);
    }

    .avatar {
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      color: white;
      font-size: 38px;
      font-weight: 750;
      line-height: 1;
      background: linear-gradient(145deg, #20c8f6, #1688f8);
      border: 4px solid white;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(22, 136, 248, .28);
      user-select: none;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.4;
    }

    .qq-number {
      margin: 6px 0 24px;
      color: #6b7280;
      font-size: 15px;
    }

    .actions {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 12px 18px;
      border: 0;
      border-radius: 14px;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid rgba(22, 136, 248, .28); outline-offset: 2px; }

    .primary {
      color: white;
      background: linear-gradient(135deg, #18b9f3, #1677ff);
      box-shadow: 0 8px 20px rgba(22, 119, 255, .22);
    }

    .secondary {
      color: #1677ff;
      background: #edf5ff;
    }

    .notice {
      min-height: 42px;
      margin: 18px 2px 0;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.65;
    }

    .notice[data-state="success"] { color: #16803c; }
    .notice[data-state="warning"] { color: #9a6200; }

    .privacy {
      margin: 14px 0 0;
      color: #9ca3af;
      font-size: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" role="img" aria-label="QQ 头像">Q</div>
    <h1 id="nickname">QQ 用户</h1>
    <p class="qq-number">QQ：<span id="qqNumber"></span></p>

    <div class="actions">
      <button class="primary" id="openQQ" type="button">打开 QQ 个人资料</button>
      <button class="secondary" id="openLegacyQQ" type="button">旧版 QQ 兼容打开</button>
      <button class="secondary" id="copyQQ" type="button">复制 QQ 号</button>
    </div>

    <p class="notice" id="notice" role="status" aria-live="polite">
      如果无法唤起 QQ，请先确认已安装手机 QQ；也可复制 QQ 号后在 QQ 内搜索。
    </p>
    <p class="privacy">只有点击按钮时才会尝试打开 QQ</p>
  </main>

  <script>
    (() => {
      "use strict";

      // 以后更换 QQ 号时，只需修改下面这一行。
      const QQ_NUMBER = "3694756983";
      const QQ_SCHEME = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${encodeURIComponent(QQ_NUMBER)}&card_type=person&source=qrcode`;
      const LEGACY_QQ_SCHEME = `mqqwpa://im/chat?chat_type=wpa&uin=${encodeURIComponent(QQ_NUMBER)}&version=1&src_type=web`;

      const numberElement = document.getElementById("qqNumber");
      const openButton = document.getElementById("openQQ");
      const legacyOpenButton = document.getElementById("openLegacyQQ");
      const copyButton = document.getElementById("copyQQ");
      const notice = document.getElementById("notice");

      numberElement.textContent = QQ_NUMBER;

      function showNotice(message, state) {
        notice.textContent = message;
        notice.dataset.state = state || "";
      }

      openButton.addEventListener("click", () => {
        showNotice("正在尝试打开手机 QQ……", "");
        window.location.href = QQ_SCHEME;

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            showNotice("未能打开 QQ？请确认已安装手机 QQ，或复制 QQ 号后在 QQ 内搜索。", "warning");
          }
        }, 1600);
      });

      legacyOpenButton.addEventListener("click", () => {
        showNotice("正在尝试通过兼容方式打开手机 QQ……", "");
        window.location.href = LEGACY_QQ_SCHEME;

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            showNotice("未能打开 QQ？请复制 QQ 号后在 QQ 内搜索，或将 QQ 升级到较新版本。", "warning");
          }
        }, 1600);
      });

      async function copyWithFallback(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        input.style.pointerEvents = "none";
        document.body.appendChild(input);
        input.select();
        input.setSelectionRange(0, input.value.length);

        const copied = document.execCommand("copy");
        input.remove();
        if (!copied) throw new Error("copy failed");
      }

      copyButton.addEventListener("click", async () => {
        try {
          await copyWithFallback(QQ_NUMBER);
          showNotice(`QQ 号 ${QQ_NUMBER} 已复制`, "success");
        } catch (_) {
          showNotice(`复制失败，请长按或手动记录 QQ 号：${QQ_NUMBER}`, "warning");
        }
      });
    })();
  </script>
</body>
</html>
