<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff3f8">
  <title>淼淼热气球领取</title>
  <meta name="description" content="联系淼淼，领取热气球。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="淼淼热气球领取">
  <meta property="og:description" content="点击页面按钮，打开 QQ 联系淼淼领取热气球。">
  <meta property="og:image" content="assets/miaomiao.jpg">

  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #47333d;
      background: #fff6fa;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 151, 193, .28), transparent 28%),
        radial-gradient(circle at 86% 4%, rgba(255, 209, 111, .28), transparent 24%),
        linear-gradient(160deg, #fff9fc 0%, #fff0f6 55%, #fff8ec 100%);
    }

    .card {
      width: min(100%, 400px);
      overflow: hidden;
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(222, 116, 159, .12);
      border-radius: 28px;
      box-shadow: 0 22px 60px rgba(128, 65, 91, .13);
    }

    .cover {
      position: relative;
      height: 226px;
      overflow: hidden;
      background: #f6dbe6;
    }

    .cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center 31%;
    }

    .cover::after {
      content: "";
      position: absolute;
      inset: 45% 0 0;
      background: linear-gradient(transparent, rgba(255, 255, 255, .96));
      pointer-events: none;
    }

    .content {
      position: relative;
      margin-top: -20px;
      padding: 0 24px 26px;
      text-align: center;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 6px 13px;
      color: #d84e86;
      font-size: 13px;
      font-weight: 700;
      background: #fff0f6;
      border: 1px solid #ffd4e4;
      border-radius: 999px;
    }

    h1 {
      margin: 12px 0 5px;
      color: #38252e;
      font-size: 26px;
      line-height: 1.35;
    }

    .subtitle {
      margin: 0 auto;
      color: #8b6c7a;
      font-size: 15px;
      line-height: 1.7;
    }

    .qq-number {
      margin: 13px 0 20px;
      color: #a36f85;
      font-size: 14px;
    }

    .actions {
      display: grid;
      gap: 11px;
    }

    button {
      width: 100%;
      min-height: 52px;
      padding: 12px 18px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, opacity .12s ease;
    }

    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid rgba(231, 84, 143, .24); outline-offset: 2px; }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, #ff74aa, #eb4f8c);
      box-shadow: 0 10px 24px rgba(224, 67, 127, .25);
    }

    .secondary {
      color: #d84e86;
      background: #fff0f6;
      border: 1px solid #ffd9e7;
    }

    .notice {
      min-height: 42px;
      margin: 17px 2px 0;
      color: #9b7d8b;
      font-size: 13px;
      line-height: 1.65;
    }

    .notice[data-state="success"] { color: #16803c; }
    .notice[data-state="warning"] { color: #a26300; }

    .privacy {
      margin: 10px 0 0;
      color: #b7a1ab;
      font-size: 12px;
    }

    @media (max-height: 700px) {
      .cover { height: 190px; }
      .content { padding-bottom: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="cover">
      <img src="assets/miaomiao.jpg" alt="淼淼热气球头像">
    </div>

    <section class="content">
      <div class="tag" aria-label="热气球领取">🎈 热气球领取</div>
      <h1>淼淼热气球</h1>
      <p class="subtitle">点击下方按钮打开 QQ<br>联系淼淼领取热气球
      </p>
      <div class="actions">
        <button class="primary" id="openQQ" type="button">打开 QQ 联系淼淼</button>
        <button class="secondary" id="copyQQ" type="button">复制 QQ 号</button>
      </div>

      <p class="notice" id="notice" role="status" aria-live="polite">
        如果无法打开 QQ，请复制 QQ 号后在 QQ 内搜索。
      </p>
      <p class="privacy">只有点击按钮时才会尝试打开 QQ</p>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      // 以后更换 QQ 号时，只需修改下面这一行。
      const QQ_NUMBER = "3694756983";
      const QQ_SCHEME = `mqqapi://card/show_pslcard?src_type=internal&version=1&uin=${encodeURIComponent(QQ_NUMBER)}&card_type=person&source=qrcode`;

      const openButton = document.getElementById("openQQ");
      const copyButton = document.getElementById("copyQQ");
      const notice = document.getElementById("notice");

      function showNotice(message, state) {
        notice.textContent = message;
        notice.dataset.state = state || "";
      }

      openButton.addEventListener("click", () => {
        showNotice("正在尝试打开手机 QQ……", "");
        window.location.href = QQ_SCHEME;

        window.setTimeout(() => {
          if (document.visibilityState === "visible") {
            showNotice("未能打开 QQ？请复制 QQ 号后在 QQ 内搜索，或将 QQ 升级到较新版本。", "warning");
          }
        }, 1600);
      });

      async function copyWithFallback(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const input = document.createElement("textarea");
        input.value = text;
        input.setAttribute("readonly", "");
        input.style.position = "fixed";
        input.style.opacity = "0";
        input.style.pointerEvents = "none";
        document.body.appendChild(input);
        input.select();
        input.setSelectionRange(0, input.value.length);

        const copied = document.execCommand("copy");
        input.remove();
        if (!copied) throw new Error("copy failed");
      }

      copyButton.addEventListener("click", async () => {
        try {
          await copyWithFallback(QQ_NUMBER);
          showNotice(`QQ 号 ${QQ_NUMBER} 已复制，请打开 QQ 搜索联系。`, "success");
        } catch (_) {
          showNotice(`复制失败，请长按或手动记录 QQ 号：${QQ_NUMBER}`, "warning");
        }
      });
    })();
  </script>
</body>
</html>
